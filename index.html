<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="lorena">
    <meta name="description" content="pagina de inicio">
    <meta name="keywords" content="html,css, proyecto, web">
    <link rel="stylesheet" href="./pages/index.css">
    <title>Alrededor The U.S.</title>
</head>

<body>
    <div class="page">
        <header class="header">
            <div class="header__titulo">
                Around <span class="header__subtitulo">The U.S.</span></div>
            <hr class="header__linea">
        </header>
        <main class="content">
            <section class="profile">
                <div class="profile__avatar-container">
                    <img class="profile__imagen" src="./images/Avatar.png" alt="imagen de perfil">
                    <button id="openAvatar" type="submit" class="avatar__btnedit" alt=" lapis de edicion"></button>
                </div>
                <div class="profile__info">
                    <h1 class="profile__usuario" id="usuareProfile">Jacques Cousteau</h1>
                    <button id="openEdit" type="submit" class="profile__btnedit" alt=" lapis de edicion"></button>
                    <p class="profile__description" id="bioProfile">Explorador</p>
                    <button id="openSutmit" type="submit" class="profile__btnadd" alt="signo de suma"></button>
                </div>
                <div id="edit" class="popup editor">

                    <div class="editor__form">
                        <span id="closeEdit" class="editor__close popup__close"></span>

                        <h2 class="editor__tiulo">Editar perfil</h2>
                        <form action="" id="formProfile" class="editor__form-edit" novalidate>
                            <label>
                                <input type="text" placeholder="Nombre" id="name" name="name" class="editor__text"
                                    required minlength="2" maxlength="40">
                                <span class="form__input-error name-error"></span>
                            </label>
                            <label>
                                <input type="text" placeholder="Acerca de mí" id="bio" name="bio" class="editor__text"
                                    required minlength="2" maxlength="200">
                                <span class="form__input-error bio-error"></span>

                            </label>

                            <button id="submitForm" disabled type="submit"
                                class="editor__btn-submit  popup__close ">Guardar</button>

                        </form>
                    </div>
                </div>
                <div id="update" class="popup submit">
                    <div class="submit__form">
                        <span id="closeSubmit" class="submit__close popup__close"></span>

                        <h2 class="submit__tiulo">Nuevo lugar</h2>
                        <form action="" id="updateFormS" class="submit__form-submit" novalidate>
                            <label>
                                <input type="text" placeholder="Título" id="title" name="title" class="submit__name"
                                    required minlength="2" maxlength="30">
                                <span class="form__input-error title-error"></span>
                            </label>
                            <label>
                                <input type="url" placeholder="Enlace a la imagen" id="link" name="link"
                                    class="submit__img" required>
                                <span class="form__input-error link-error"></span>
                            </label>
                            <button id="save" disabled type="submit" class="submit__btn-submit ">Crear
                            </button>
                        </form>
                    </div>
                </div>

                <div id="avatar" class="popup avatarEdit">
                    <div class="avatar__form">
                        <span class="avatar__close popup__close"></span>

                        <h2 class="avatar__tiulo">Cambiar foto de perfil </h2>
                        <form action="" id="avatarForm" class="avatar__form-submit" class="avatar__form-submit">
                            <label>
                                <input type="url" placeholder="sube tu nueva foto " id="avatarLink" name="avatar"
                                    class="avatar__img" required>
                                <span class="form__input-error avatarLink-error"></span>
                            </label>
                            <button id="saveAvatar" disabled type="submit" class="avatar__btn-submit">Guardar
                            </button>
                        </form>
                    </div>
                </div>


                <div id="delet" class="popup delet">
                    <div class="delet__card">
                        <span class="delet__close popup__close"></span>

                        <h2 class="delet__tiulo">¿Estás seguro/a?</h2>
                        <form class="delet__form-delet">
                            <button type="submit" class="delet__btn-delet ">Si
                            </button>
                        </form>
                    </div>
                </div>
            </section>
            <section class="post">
                <template id="post-template">
                    <li class="card">
                        <div class="card__content">
                            <img class="card__image">
                            <h3 class="card__footer"></h3>
                            <button class=" card__like "></button>
                            <button class="card__delet" id="openDelet"></button>
                        </div>
                    </li>
                </template>
                <div class="Popup image_modal " id="imageModal">
                    <div class="image__container">
                        <span class="image__close popup__close" id="closeImage"></span>
                        <img class="modal__image" src="" alt="" id="modalImage">
                        <p class="modal__footer" id="modalFooter"></p>
                    </div>
                </div>

                <ul id="cards-container" class="post__card">

                </ul>

            </section>

        </main>
        <footer>
            <div>
                <p class="footer"> © 2025 Alrededor The U.S.</p>
            </div>
        </footer>



    </div>
    <script type="module" src="./pages/index.js"></script>
</body>

</html>
